# pali ceramics — reverse proxy to Next.js on port 3556
# Copy to: /etc/nginx/sites-available/pali.neostudio.space

server {
    listen 80;
    listen [::]:80;
    server_name pali.neostudio.space;

    location / {
        proxy_pass http://127.0.0.1:3556;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js / websockets (dev HMR; harmless in production)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
